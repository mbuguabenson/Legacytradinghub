    <!-- Ensure entitlement/site-settings calls use local endpoints for added domains -->
    <script>
    (function(){
        try {
            // Patch fetch to rewrite entitlement and site-settings to local endpoints
            var nativeFetch = window.fetch.bind(window);
            window.fetch = function(input, init){
                try {
                    var url = (typeof input === 'string') ? input : (input && input.url) || '';
                    var u = new URL(url, location.href);
                    var p = (u.pathname || '').toLowerCase();
                    if (p.endsWith('/api/appwrite/site-entitlement') || p.endsWith('/api/appwrite/site-settings')) {
                        var localPath = p.endsWith('/site-entitlement') ? '/api/appwrite/site-entitlement' : '/api/appwrite/site-settings';
                        var local = localPath + '?hostname=' + encodeURIComponent(location.hostname);
                        return nativeFetch(local, init);
                    }
                } catch (e) {}
                return nativeFetch(input, init);
            };

            // Patch XHR open to rewrite the same endpoints (some code uses XHR)
            var X = window.XMLHttpRequest;
            if (X && X.prototype) {
                var origOpen = X.prototype.open;
                X.prototype.open = function(method, url) {
                    try {
                        var u = new URL(url, location.href);
                        var p = (u.pathname || '').toLowerCase();
                        if (p.endsWith('/api/appwrite/site-entitlement') || p.endsWith('/api/appwrite/site-settings')) {
                            var localPath = p.endsWith('/site-entitlement') ? '/api/appwrite/site-entitlement' : '/api/appwrite/site-settings';
                            url = localPath + '?hostname=' + encodeURIComponent(location.hostname);
                        }
                    } catch (e) {}
                    return origOpen.apply(this, arguments.length > 0 ? arguments : [method, url]);
                };
            }
        } catch (e) { /* ignore */ }
    })();
    </script>

    <!-- Loader placeholder: injected from /loaders/1.html (falls back to local markup) -->
    <div id="hlx-loader" role="status" aria-label="Loading %%APP_NAME%%"></div>
    <script>
    (async function(){
        try {
            const r = await fetch('/loaders/legacy.html');
            if (!r.ok) throw new Error('no loader');
            const html = await r.text();
            const c = document.getElementById('hlx-loader');
            if (c) {
                c.innerHTML = html;
                // Ensure any scripts in the injected HTML execute
                const scripts = c.querySelectorAll('script');
                scripts.forEach(s => {
                    const ns = document.createElement('script');
                    if (s.src) ns.src = s.src;
                    ns.text = s.textContent || s.innerText || '';
                    document.body.appendChild(ns);
                    s.parentNode && s.parentNode.removeChild(s);
                });
            }
        } catch (e) {
            // fallback: simple inline loader
            const c = document.getElementById('hlx-loader');
            if (c) c.innerHTML = '<div class="hlx-load-word">%%LOGO_TEXT_MAIN%%<em>%%LOGO_TEXT_ACCENT%%</em></div><div class="hlx-load-tag">%%TAGLINE%%</div><div class="hlx-load-bar"></div>';
        }
    })();
    </script>

    <script>
    // Improved loader hiding + auth spinner
    (function () {
        var loader = document.getElementById('hlx-loader');
        var root = document.getElementById('root');
        if (!loader || !root) return;
        var done = false;
        function hide() {
            if (done) return; done = true;
            loader.classList.add('hlx-hide');
            setTimeout(function () { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
        }

        // Heuristic: consider the app ready when the root contains meaningful
        // rendered content (not just header/login). This avoids revealing a
        // nearly-empty header while the app finishes initialisation.
        function readyForContent() {
            try {
                if (root.querySelector('.loaderx-root, .initial-loader')) return false;
                var text = (root.innerText || '').trim();
                if (text.length > 250) return true; // substantial content present
                // fallback: if there are many DOM nodes, assume content mounted
                if (root.getElementsByTagName('*').length > 60) return true;
                return false;
            } catch (e) { return false; }
        }

        // Auth spinner overlay (shows during auth/API calls)
        var spinner = document.createElement('div');
        spinner.id = 'hlx-auth-spinner';
        spinner.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2147484000;pointer-events:none;opacity:0;transition:opacity .18s ease;';
        spinner.innerHTML = '<div aria-hidden="true" class="hlx-pulse-wrap" style="pointer-events:auto;display:flex;align-items:center;justify-content:center;flex-direction:column"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="10" fill="%%ACCENT_COLOR%%"/><circle cx="32" cy="32" r="10" stroke="%%ACCENT_COLOR%%" stroke-opacity=".6" stroke-width="2" style="transform-origin:32px 32px"/></svg></div>';
        document.body.appendChild(spinner);
        var pulseStyle = document.createElement('style');
        pulseStyle.innerHTML = '\n@keyframes hlx-pulse { 0%{transform:scale(.8);opacity:1}100%{transform:scale(2);opacity:0} }\n.hlx-pulse-wrap svg circle:nth-child(2){animation:hlx-pulse 1.2s linear infinite}\n.hlx-pulse-wrap{filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));}\n.hlx-auth-spinner.show{opacity:1;pointer-events:auto}\n';
        document.head.appendChild(pulseStyle);

        // Track in-flight auth/API requests that matter for first-paint/auth
        var tracked = 0;
        function showAuthSpinner() { tracked++; spinner.classList.add('show'); }
        function hideAuthSpinner() { tracked = Math.max(0, tracked-1); if (tracked === 0) spinner.classList.remove('show'); }

        // Monkey-patch fetch to show spinner for auth / site-settings calls.
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function(input, init) {
            try {
                var url = (typeof input === 'string') ? input : (input && input.url) || '';
                if (url && (url.indexOf('/api/oauth/token') !== -1 || url.indexOf('/api/appwrite') !== -1 || url.indexOf('/api/appwrite/site-settings') !== -1)) {
                    showAuthSpinner();
                    return nativeFetch(input, init).then(function(r){ hideAuthSpinner(); return r; }, function(e){ hideAuthSpinner(); throw e; });
                }
            } catch (e) {}
            return nativeFetch(input, init);
        };

        // Also show spinner when login buttons are clicked (best-effort)
        document.addEventListener('click', function (ev) {
            var t = ev.target; if (!t) return;
            if (t.matches && (t.matches('.auth-actions button') || t.matches('button.login') || t.matches('button.sign-in') || t.closest && t.closest('.auth-actions'))) {
                showAuthSpinner();
                // hide after 10s safety net if not cleared
                setTimeout(hideAuthSpinner, 10000);
            }
        }, true);

        if (readyForContent()) { setTimeout(hide, 300); return; }
        var obs = new MutationObserver(function () {
            if (readyForContent()) { obs.disconnect(); setTimeout(hide, 250); }
        });
        obs.observe(root, { childList: true, subtree: true });
        setTimeout(hide, 8000); // safety net — never trap the user behind the loader
    })();
    </script>
</body>
</html>
