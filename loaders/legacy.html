<style>
/* ── LegacyTradingHub Canvas Loader ──────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

#lth-root{
  position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;
  background:#04091f;
}

/* ── Full-canvas background ── */
#lth-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;
}

/* ── Radial glow overlay on top of canvas ── */
.lth-overlay{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 55% at 50% 0%,rgba(30,64,175,.45) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 80% 80%,rgba(37,99,235,.15) 0%,transparent 55%),
    radial-gradient(ellipse 40% 35% at 15% 70%,rgba(59,130,246,.1) 0%,transparent 55%);
  pointer-events:none;
}

/* ── Scanline texture ── */
.lth-scanlines{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
}

/* ── Center wrap ── */
.lth-wrap{
  position:relative;z-index:10;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;gap:0;
}

/* ── Top badge ── */
.lth-badge{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(30,64,175,.2);border:1px solid rgba(59,130,246,.3);
  border-radius:99px;padding:5px 14px;
  font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(147,197,253,.8);
  margin-bottom:28px;
  box-shadow:0 0 20px rgba(59,130,246,.15);
  animation:badgePulse 3s ease-in-out infinite;
}
@keyframes badgePulse{0%,100%{box-shadow:0 0 18px rgba(59,130,246,.12)}50%{box-shadow:0 0 32px rgba(59,130,246,.3)}}
.lth-badge-dot{width:6px;height:6px;border-radius:50%;background:#3b82f6;animation:dotBlink 1.4s ease-in-out infinite}
@keyframes dotBlink{0%,100%{opacity:1;box-shadow:0 0 6px #3b82f6}50%{opacity:.3;box-shadow:none}}

/* ── Main logo/brand ── */
.lth-brand{text-align:center;margin-bottom:36px}
.lth-logo-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.lth-logo-icon{
  width:58px;height:58px;border-radius:16px;flex-shrink:0;
  display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(30,64,175,.5) 0%,rgba(59,130,246,.25) 100%);
  border:1.5px solid rgba(96,165,250,.4);
  box-shadow:0 0 30px rgba(59,130,246,.35),0 0 10px rgba(96,165,250,.2) inset;
  animation:iconPulse 2.6s ease-in-out infinite;
}
@keyframes iconPulse{0%,100%{box-shadow:0 0 24px rgba(59,130,246,.3),0 0 8px rgba(96,165,250,.15) inset}50%{box-shadow:0 0 46px rgba(59,130,246,.6),0 0 20px rgba(96,165,250,.3) inset}}
.lth-logo-icon svg{color:#60a5fa;filter:drop-shadow(0 0 8px rgba(96,165,250,.9))}

.lth-wordmark{text-align:left}
.lth-name{
  font-size:2.6rem;font-weight:900;letter-spacing:-.01em;line-height:1;
  background:linear-gradient(90deg,#dbeafe 0%,#93c5fd 30%,#3b82f6 60%,#60a5fa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:nameSlide 5s linear infinite;
  white-space:nowrap;
}
@keyframes nameSlide{from{background-position:0% center}to{background-position:200% center}}
.lth-sub{
  font-size:.65rem;font-weight:600;letter-spacing:.5em;text-transform:uppercase;
  color:rgba(147,197,253,.45);margin-top:4px;
}

.lth-tagline{
  font-size:.92rem;color:rgba(203,213,225,.6);font-style:italic;font-weight:300;
  letter-spacing:.02em;
}

/* ── Glass card ── */
.lth-card{
  width:min(500px,95vw);
  border-radius:20px;
  background:rgba(4,9,31,.65);
  border:1px solid rgba(59,130,246,.15);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04),
    0 28px 90px rgba(0,0,0,.7),
    0 0 80px rgba(30,64,175,.1) inset;
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  padding:28px 26px 22px;
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) .1s both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}

/* ── Step row ── */
.lth-steps{
  display:flex;align-items:center;gap:0;margin-bottom:22px;
}
.lth-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.lth-step:not(:last-child)::after{
  content:'';position:absolute;top:14px;left:calc(50% + 14px);
  width:calc(100% - 28px);height:1.5px;
  background:linear-gradient(90deg,rgba(59,130,246,.25),rgba(59,130,246,.05));
  transition:background .4s;
}
.lth-step--done:not(:last-child)::after{background:linear-gradient(90deg,rgba(59,130,246,.7),rgba(59,130,246,.2))}
.lth-step-dot{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  font-size:10px;font-weight:800;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);
  color:rgba(148,163,184,.4);
  transition:all .35s cubic-bezier(.4,0,.2,1);
  z-index:1;margin-bottom:5px;
}
.lth-step-lbl{font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:rgba(148,163,184,.4);text-align:center;transition:color .35s}
.lth-step--done .lth-step-dot{background:rgba(30,64,175,.4);border-color:rgba(96,165,250,.6);color:#93c5fd}
.lth-step--active .lth-step-dot{
  background:linear-gradient(135deg,rgba(37,99,235,.5),rgba(96,165,250,.3));
  border-color:#60a5fa;color:#dbeafe;
  box-shadow:0 0 0 5px rgba(59,130,246,.12),0 0 18px rgba(59,130,246,.4);
  animation:stepGlow 1.2s ease-in-out infinite;
}
@keyframes stepGlow{0%,100%{box-shadow:0 0 0 4px rgba(59,130,246,.1),0 0 14px rgba(59,130,246,.35)}50%{box-shadow:0 0 0 8px rgba(59,130,246,.18),0 0 28px rgba(59,130,246,.6)}}
.lth-step--active .lth-step-lbl{color:rgba(147,197,253,.85)}

/* ── Stat chips ── */
.lth-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.lth-stat{
  border-radius:12px;padding:13px 10px;text-align:center;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(59,130,246,.1);
  transition:all .3s;
}
.lth-stat:hover{background:rgba(37,99,235,.08);border-color:rgba(96,165,250,.22)}
.lth-stat-val{
  font-size:1.35rem;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,#60a5fa,#93c5fd);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;margin-bottom:4px;
}
.lth-stat-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(148,163,184,.55)}

/* ── Status ── */
.lth-status{text-align:center;margin-bottom:14px}
.lth-status-top{font-size:.72rem;color:rgba(148,163,184,.5);margin-bottom:3px;letter-spacing:.02em}
.lth-status-msg{
  font-size:.82rem;font-weight:600;color:#60a5fa;
  min-height:1.2em;
  transition:opacity .2s;
}

/* ── Progress bar ── */
.lth-progress{display:grid;gap:7px}
.lth-track{
  position:relative;width:100%;height:7px;
  border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.06);
}
.lth-fill{
  position:absolute;inset:0 auto 0 0;
  background:linear-gradient(90deg,#1d4ed8,#2563eb,#3b82f6,#60a5fa,#93c5fd);
  background-size:200% 100%;
  border-radius:99px;
  transition:width .28s cubic-bezier(.4,0,.2,1);
  animation:fillShimmer 2.2s linear infinite;
  box-shadow:0 0 14px rgba(59,130,246,.7);
}
@keyframes fillShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.lth-pulse{
  position:absolute;top:0;bottom:0;width:35%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  animation:pulseSweep 2s linear infinite;border-radius:99px;
}
@keyframes pulseSweep{from{left:-35%}to{left:130%}}
.lth-pct-row{display:flex;justify-content:space-between;align-items:center}
.lth-pct{font-size:.7rem;font-weight:700;color:rgba(147,197,253,.7)}
.lth-eta{font-size:.65rem;color:rgba(100,116,139,.55)}

/* ── Footer ── */
.lth-footer{margin-top:14px;text-align:center;font-size:.62rem;color:rgba(100,116,139,.4);letter-spacing:.04em}
.lth-footer a{color:rgba(96,165,250,.45);text-decoration:none}
.lth-footer a:hover{color:rgba(96,165,250,.75)}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){
  *,::before,::after{animation:none!important;transition:none!important}
}
</style>

<div id="lth-root">
  <!-- Live canvas background -->
  <canvas id="lth-canvas"></canvas>
  <div class="lth-overlay"></div>
  <div class="lth-scanlines"></div>

  <div class="lth-wrap">
    <!-- Live badge -->
    <div class="lth-badge">
      <span class="lth-badge-dot"></span>
      <span>Live Trading Platform</span>
    </div>

    <!-- Brand -->
    <div class="lth-brand">
      <div class="lth-logo-wrap">
        <div class="lth-logo-icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            <polyline points="16 7 22 7 22 13"/>
          </svg>
        </div>
        <div class="lth-wordmark">
          <div class="lth-name">%%APP_NAME%%</div>
          <div class="lth-sub">Institutional Suite</div>
        </div>
      </div>
      <div class="lth-tagline">%%TAGLINE%%</div>
    </div>

    <!-- Card -->
    <div class="lth-card">
      <!-- Steps -->
      <div class="lth-steps" id="lth-steps"></div>

      <!-- Stats -->
      <div class="lth-stats">
        <div class="lth-stat">
          <div class="lth-stat-val" id="lth-uptime">99.9%</div>
          <div class="lth-stat-lbl">Uptime</div>
        </div>
        <div class="lth-stat">
          <div class="lth-stat-val" id="lth-latency">~18ms</div>
          <div class="lth-stat-lbl">Latency</div>
        </div>
        <div class="lth-stat">
          <div class="lth-stat-val" id="lth-markets">50+</div>
          <div class="lth-stat-lbl">Markets</div>
        </div>
      </div>

      <!-- Status -->
      <div class="lth-status">
        <div class="lth-status-top">System status</div>
        <div class="lth-status-msg" id="lth-msg">Connecting to Deriv WebSocket…</div>
      </div>

      <!-- Progress -->
      <div class="lth-progress">
        <div class="lth-track">
          <div class="lth-fill" id="lth-fill" style="width:0%"></div>
          <div class="lth-pulse"></div>
        </div>
        <div class="lth-pct-row">
          <div class="lth-pct" id="lth-pct">0%</div>
          <div class="lth-eta" id="lth-eta">Initializing…</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="lth-footer">
        © <span id="lth-yr"></span> %%APP_NAME%% · Powered by <a href="https://deriv.com" target="_blank" rel="noopener">Deriv</a> · All rights reserved
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ── Year ── */
  var yr = document.getElementById('lth-yr');
  if(yr) yr.textContent = new Date().getFullYear();

  /* ─────────────────────────────────────────────────────────────────────────
     FULL-CANVAS ANIMATED TRADING CHART BACKGROUND
     Renders: grid lines, multiple sine-wave "price" lines, floating
     candlestick shapes, animated glow particles, and falling data digits.
  ───────────────────────────────────────────────────────────────────────── */
  var canvas = document.getElementById('lth-canvas');
  var ctx = canvas.getContext('2d');

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* -- palette -- */
  var BLUE1='rgba(30,64,175,';
  var BLUE2='rgba(59,130,246,';
  var BLUE3='rgba(96,165,250,';
  var CYAN ='rgba(34,211,238,';

  /* -- grid -- */
  function drawGrid(){
    var W=canvas.width, H=canvas.height;
    var step=52;
    ctx.lineWidth=.4;
    for(var x=0;x<W;x+=step){
      ctx.beginPath();
      var a=(x%208===0)?'.12':'0.055';
      ctx.strokeStyle=BLUE2+a+')';
      ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(var y=0;y<H;y+=step){
      ctx.beginPath();
      var b=(y%208===0)?'.12':'0.055';
      ctx.strokeStyle=BLUE2+b+')';
      ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
  }

  /* -- price lines -- */
  var lines=[
    {color:BLUE2,alpha:.55,amp:70,freq:.008,speed:.3,yBase:.38,offset:0},
    {color:BLUE3,alpha:.35,amp:45,freq:.013,speed:.5,yBase:.55,offset:2},
    {color:CYAN, alpha:.25,amp:30,freq:.018,speed:.7,yBase:.65,offset:5},
    {color:BLUE1,alpha:.4, amp:90,freq:.005,speed:.2,yBase:.30,offset:1},
  ];

  function drawLines(t){
    var W=canvas.width,H=canvas.height;
    lines.forEach(function(l){
      ctx.beginPath();
      ctx.lineWidth=1.4;
      for(var x=0;x<=W;x+=2){
        var y=H*l.yBase + Math.sin((x+t*l.speed*60+l.offset)*l.freq)*l.amp
                        + Math.sin((x*1.7+t*l.speed*40)*l.freq*.7)*l.amp*.4;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle=l.color+l.alpha+')';
      ctx.stroke();

      /* fill under line */
      ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
      var grad=ctx.createLinearGradient(0,H*l.yBase-l.amp,0,H);
      grad.addColorStop(0,l.color+(l.alpha*.35)+')');
      grad.addColorStop(1,l.color+'0)');
      ctx.fillStyle=grad;ctx.fill();
    });
  }

  /* -- particles -- */
  var particles=[];
  (function initParticles(){
    for(var i=0;i<55;i++){
      particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+.5,
        vx:(Math.random()-.5)*.4,
        vy:(Math.random()-.5)*.4,
        a:Math.random()*.5+.15,
        col:Math.random()>.5?BLUE2:BLUE3
      });
    }
  })();

  function drawParticles(){
    var W=canvas.width,H=canvas.height;
    particles.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col+p.a+')';
      ctx.fill();
    });
    /* connect nearby */
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x;
        var dy=particles[i].y-particles[j].y;
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){
          ctx.beginPath();
          ctx.lineWidth=.5;
          ctx.strokeStyle=BLUE2+(0.08*(1-d/110))+')';
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.stroke();
        }
      }
    }
  }

  /* -- falling data digits -- */
  var cols=Math.floor(canvas.width/20);
  var drops=[];
  for(var i=0;i<cols;i++) drops[i]=Math.random()*canvas.height/14;

  function drawMatrix(t){
    ctx.fillStyle='rgba(4,9,31,.04)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font='11px monospace';
    for(var i=0;i<drops.length;i++){
      var ch=(Math.floor(Math.random()*10)).toString();
      ctx.fillStyle=BLUE2+'0.12)';
      ctx.fillText(ch,i*20,drops[i]*14);
      if(drops[i]*14>canvas.height && Math.random()>.96) drops[i]=0;
      drops[i]+=.15;
    }
  }

  /* -- main animation -- */
  var startT=null;
  function frame(ts){
    if(!startT)startT=ts;
    var t=(ts-startT)/1000;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawMatrix(t);
    drawGrid();
    drawLines(t);
    drawParticles();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ── Steps ── */
  var STEPS=['Auth','Markets','AI Engine','Bots','Dashboard'];
  var stepsEl=document.getElementById('lth-steps');
  if(stepsEl){
    STEPS.forEach(function(s,i){
      var d=document.createElement('div');
      d.className='lth-step';
      d.id='lth-s'+i;
      d.innerHTML='<div class="lth-step-dot">'+(i+1)+'</div><div class="lth-step-lbl">'+s+'</div>';
      stepsEl.appendChild(d);
    });
  }

  /* ── Animate latency chip ── */
  var latEl=document.getElementById('lth-latency');
  setInterval(function(){
    if(latEl) latEl.textContent='~'+(Math.floor(Math.random()*12)+12)+'ms';
  },1200);

  /* ── Progress ── */
  var MSGS=[
    'Connecting to Deriv WebSocket…',
    'Authenticating session…',
    'Loading live market feeds…',
    'Initializing AI signal engine…',
    'Mounting trading bots…',
    'Calibrating risk engine…',
    'Dashboard ready — launching…'
  ];
  var ETAS=['~6s remaining','~5s remaining','~4s remaining','~3s remaining','~2s remaining','~1s remaining','Done!'];

  var fill=document.getElementById('lth-fill');
  var pctEl=document.getElementById('lth-pct');
  var msgEl=document.getElementById('lth-msg');
  var etaEl=document.getElementById('lth-eta');
  var stepEls=document.querySelectorAll('.lth-step');
  var p=0, mi=0;

  function updateSteps(){
    stepEls.forEach(function(d,i){
      d.classList.remove('lth-step--done','lth-step--active');
      var cur=Math.floor((p/100)*STEPS.length);
      if(i<cur) d.classList.add('lth-step--done');
      if(i===cur) d.classList.add('lth-step--active');
    });
  }

  function tick(){
    p=Math.min(100,p+Math.floor(Math.random()*6)+3);
    if(fill) fill.style.width=p+'%';
    if(pctEl) pctEl.textContent=p+'%';
    if(msgEl) msgEl.textContent=MSGS[Math.min(mi,MSGS.length-1)];
    if(etaEl) etaEl.textContent=ETAS[Math.min(mi,ETAS.length-1)];
    if(Math.random()>.6) mi++;
    updateSteps();

    if(p>=100){
      var root=document.getElementById('lth-root');
      if(root){
        root.style.transition='opacity .55s ease,visibility .55s ease';
        root.style.opacity='0';root.style.visibility='hidden';
        setTimeout(function(){if(root&&root.parentNode)root.parentNode.removeChild(root);},650);
      }
      return;
    }
    setTimeout(tick, 340+Math.random()*260);
  }
  setTimeout(tick, 350);
})();
</script>
